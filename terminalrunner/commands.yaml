commands:
  - title: Собрать все
    description: Собрать все компоненты, кроме dsclient, без тестов.
    executable: do all local-build-up --skip=dsclient --no-tests

  - title: Включить все
    description: Запустить все локальные компоненты.
    executable: do all local-up

  - title: Собрать webserver
    description: Собрать webserver без тестов.
    executable: do webserver local-build-up --no-tests

  - title: Сгенерировать типы web-клиента
    description: Сгенерировать типы для web-клиента.
    executable: do webclient gen

  - title: Собрать dsweb
    description: Собрать dsweb без тестов и JavaScript.
    executable: do dsweb local-build-up --no-tests --no-js

  - title: Собрать dsdesktop
    description: Собрать dsdesktop без тестов.
    executable: do dsdesktop local-build-up --no-tests

  - title: Сгенерировать типы DS-клиента
    description: Сгенерировать типы для DS-клиента.
    executable: do dsclient gen

