[build-system]
requires = ["setuptools>=68,<84"]
build-backend = "setuptools.build_meta"

[project]
name = "terminalrunner"
version = "0.1.0"
description = "TUI launcher for configured terminal commands"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.3,<7", "textual>=8.2.8,<9"]

[project.optional-dependencies]
dev = ["build>=1.2,<2", "mypy>=1.13,<2", "ruff>=0.9,<1", "types-PyYAML>=6.0,<7", "pyinstaller>=6.11,<7; sys_platform == 'win32'"]

[project.scripts]
terminalrunner = "terminalrunner.__main__:main"

[tool.setuptools]
packages = ["terminalrunner"]

[tool.setuptools.package-data]
terminalrunner = ["app.tcss", "commands.yaml"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F"]

[tool.mypy]
files = ["terminalrunner"]
python_version = "3.11"
strict = true
